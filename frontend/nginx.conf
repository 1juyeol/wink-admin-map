# [Nginx] 프론트 정적 파일 서빙 설정
#
# 기존 firebase.json의 hosting 역할(정적 서빙 + SPA rewrite)을 그대로 대체한다.
# 이 프로젝트는 백엔드/DB가 없어 /api, /ws 같은 프록시 설정은 필요 없다
# (teams-kanban-board의 nginx.conf와 달리 프록시 블록이 없는 이유).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: 존재하지 않는 경로는 전부 index.html로 넘겨, React Router 없이
    # view 상태로 라우팅하는 기존 방식이 새로고침에도 깨지지 않게 한다.
    location / {
        try_files $uri /index.html;
    }
}
